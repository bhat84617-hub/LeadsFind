# Render Free instance 15 min idle pe so jata hai — ye har 5 min health
# ping karke usko 24/7 awake rakhta hai. Public repo = Actions free unlimited.
name: Keep-Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://leadsfind.onrender.com/_stcore/health"
          echo "PING $URL"
          # Cold start ~50s leta hai — 4 attempts, har ek 60s tak
          for i in 1 2 3 4; do
            code=$(curl -sS -o /tmp/health_body -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "attempt $i -> HTTP $code : $(cat /tmp/health_body 2>/dev/null)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::LeadsFind health check fail — Render pe kuch galat hai"
          exit 1
