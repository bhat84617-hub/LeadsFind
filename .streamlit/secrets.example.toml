# Local Google-login test ke liye: copy -> .streamlit/secrets.toml, values bharo.
# (secrets.toml kabhi GitHub pe mat dalna!)
# Render/Docker pe ye file apne aap banti hai (entrypoint.sh) — env vars se:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, LF_COOKIE_SECRET
# Cloud pe env-vars hi daalna, file upload ki zaroorat nahi.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "yahan-koi-lambi-random-string-dalo-32-char"

[auth.google]
client_id = "XXXX.apps.googleusercontent.com"
client_secret = "XXXX"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
