[client]
# Deploy button / toolbar hatao — personal project hai
toolbarMode = "minimal"

[server]
headless = true
# static/ folder se fonts serve hoti hain (local font = zero Google round-trip)
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#b154f9"
backgroundColor = "#f1f1f1"
secondaryBackgroundColor = "#ffffff"
textColor = "#171717"

