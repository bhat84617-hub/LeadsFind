# Render Free Blueprint — LeadsFind
# Dashboard: New -> Blueprint -> ye repo connect karo (ye file auto detect ho jayegi)
services:
  - type: web
    name: leadsfind
    runtime: docker
    plan: free
    # Healthy endpoint: server fully up hone pe 200 "ok" deta hai
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ADMIN_USER
        value: admin
      # Neeche wali keys Render Dashboard -> Environment me baad me daalna (sync: false)
      - key: ADMIN_PASS
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: LF_CALLBACK_URL
        sync: false
      # Google Login (Gmail se direct signup/login)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Google Console ke "Authorized redirect URIs" se EXACT match hona chahiye
      - key: LF_OAUTH_REDIRECT_URI
        value: https://leadsfind.onrender.com/oauth2callback
      # Google Maps: agar home-PC tunnel URL do toh scraping home IP se hogi
      # (HOME_MAPS.bat chala kar link yahan paste karo). Khali = andar ka sidecar.
      - key: GMAPS_BASE_URL
        sync: false
      # OAuth cookie secret — Render pehli baar ek random value khud banata hai
      - key: LF_COOKIE_SECRET
        generateValue: true
